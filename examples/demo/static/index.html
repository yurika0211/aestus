<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aestus · 记忆</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="mark">Ae</div>
      <nav>
        <button class="nav active" type="button" data-view="graph">图</button>
        <button class="nav" type="button" data-view="notes">笔记</button>
      </nav>
    </aside>

    <main>
      <section class="stage" id="graph-view">
        <div class="canvas">
          <div class="float top">
            <input id="query" placeholder="追踪一条记忆" spellcheck="false">
            <button class="solid" id="trace" type="button">追踪</button>
            <button class="mini" id="clear" type="button" hidden>清除</button>
            <span class="elapsed" id="elapsed"></span>
            <span class="spacer"></span>
            <button class="ghost" id="fit" type="button">适配</button>
            <button class="ghost" id="options" type="button">力</button>
          </div>
          <div class="float filters">
            <button class="chip" id="all-notes" type="button">全部</button>
            <button class="chip" id="around" type="button" disabled>周围</button>
            <select id="depth" title="图跳数">
              <option value="1">1 跳</option>
              <option value="2" selected>2 跳</option>
              <option value="3">3 跳</option>
            </select>
            <label class="toggle"><input id="incoming" type="checkbox" checked>入</label>
            <label class="toggle"><input id="outgoing" type="checkbox" checked>出</label>
            <label class="toggle"><input id="unresolved" type="checkbox" checked>未解析</label>
            <input id="filter" placeholder="过滤" spellcheck="false">
            <input id="isolated" type="checkbox" hidden>
          </div>
          <section class="playbar float play" id="playbar" hidden>
            <button class="mini" id="play-reset" type="button">重置</button>
            <button class="mini" id="play-back" type="button">上一步</button>
            <button class="solid" id="play" type="button">播放</button>
            <button class="mini" id="play-step" type="button">下一步</button>
            <span class="elapsed" id="playhead"></span>
          </section>
          <section class="options float panel" id="options-panel" hidden>
            <label>中心 <input id="force-center" type="range" min="0" max="1" step="0.01" value="0.1"></label>
            <label>排斥 <input id="force-repel" type="range" min="0" max="20" step="0.1" value="10"></label>
            <label>链接 <input id="force-link" type="range" min="0" max="1" step="0.01" value="1"></label>
            <label>距离 <input id="force-distance" type="range" min="30" max="500" step="1" value="250"></label>
            <label>节点 <input id="node-size" type="range" min="0.4" max="2.4" step="0.1" value="1"></label>
            <label>线宽 <input id="line-size" type="range" min="0.4" max="2.4" step="0.1" value="1"></label>
            <label>文字 <input id="text-fade" type="range" min="-2" max="2" step="0.1" value="0"></label>
            <label class="toggle"><input id="arrows" type="checkbox">箭头</label>
            <button class="mini" id="force-reset" type="button">默认</button>
          </section>
          <svg id="graph" viewBox="0 0 1200 760" role="img" aria-label="记忆图谱"></svg>
          <div class="legend" id="legend">
            <span><i class="dot low"></i>1–2 条链接</span>
            <span><i class="dot mid"></i>3–5</span>
            <span><i class="dot high"></i>6–11</span>
            <span><i class="dot hub"></i>12+</span>
            <span><i class="ring"></i>未解析</span>
          </div>
        </div>
        <aside class="detail" id="detail">
          <p class="muted">点一个节点，或追踪一条查询。</p>
        </aside>
      </section>

      <section class="notes" id="notes-view" hidden>
        <form id="remember" class="composer">
          <textarea name="content" rows="3" required placeholder="记一条，可以用 [[链接]] 接到已有笔记"></textarea>
          <div class="row">
            <select name="category">
              <option value="fact">事实</option>
              <option value="preference">偏好</option>
              <option value="rule">规则</option>
              <option value="project">项目</option>
            </select>
            <select name="tier">
              <option value="medium">中期</option>
              <option value="long">长期</option>
              <option value="short">短期</option>
            </select>
            <input name="links" placeholder="链接，逗号分隔" spellcheck="false">
            <button class="solid" type="submit">记住</button>
          </div>
        </form>
        <ol id="recent"></ol>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
